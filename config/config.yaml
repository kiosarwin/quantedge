# ============================================================
#  NINJA TRADER — Futures Edition (config.yaml)
#  Binance USDT-margined Perpetual Futures
# ============================================================

exchange:
  name: binance_futures
  testnet: false                    # Paper mode uses live public market data; live orders still require mode=live
  # Credentials: set BINANCE_API_KEY and BINANCE_API_SECRET in .env (never in this file)
  recv_window: 10000
  fapi_base_url: "https://fapi.binance.com"     # fapi1/2/3 blocked in ID; fapi.binance.com works

trading:
  mode: paper                      # paper | live | backtest
  exploration_mode: false          # false = paper validates production gates instead of taking exploratory losses
  base_currency: USDT
  paper_starting_equity: 100       # Reset fresh paper run from $100
  paper_state_reset_token: "reset_100_2026_05_29"
  # ── AGGRESSIVE-EDGE TUNING (2026-05) ────────────────────────────────────
  # Bot now imports cleanly; we widen sampling so lifecycle can collect samples.
  # Regime + smart-money gates remain active; EV is observed but not gating
  # until a durable edge is found.
  min_score_threshold: 35          # Relaxed for paper + chaos penalty reform (was 42)
  max_open_trades: 2               # Two concurrent base; paper override widens further
  top_pairs_to_trade: 2
  scan_pool_size: 45               # Wider opportunity funnel; config-only universe expansion
  scan_interval_seconds: 60
  candle_refresh_seconds: 30
  signal_confirmation_scans: 1     # Faster reaction for paper edge discovery
  signal_max_age_seconds: 300      # expire signal if not confirmed within 5 min
  regime_thresholds:               # Per-regime override of min_score_threshold
    trending_expansion: 35          # Relaxed + chaos penalty reform (was 42)
    accumulation_compression: 35   # Relaxed + chaos penalty reform (was 42)
    distribution: 38               # Relaxed + chaos penalty reform (was 45)

# ── Paper Validation Throughput ──────────────────────────────────────────────
# Purpose: collect enough samples in paper mode without weakening live-mode
# guardrails. This is a controlled relaxation layer, not a live trading policy.
position_rotation:
  enabled: true
  max_rotations_per_cycle: 1
  max_rotations_per_day: 3
  min_candidate_score: 72.0
  min_score_advantage: 14.0
  min_candidate_quality: 58.0
  min_candidate_p_win: 0.38
  min_candidate_ev_net_pct: -0.75
  positive_ev_probe_min_candidate_score: 35.0
  positive_ev_probe_min_score_advantage: 0.0
  positive_ev_probe_min_candidate_quality: 0.0
  min_victim_age_s: 7200
  protect_after_tp1: true
  protect_mfe_r: 0.80
  protect_unrealized_gain_r: 0.30
  protect_unrealized_gain_pct: 3.0
  protect_winner_min_age_s: 21600
  max_victim_adverse_r: 0.90

paper_validation:
  enabled: true
  allowed_directions:
    - long
    - short
  allowed_regimes:
    - trending_expansion
    - accumulation_compression
    - distribution
  allowed_strategy_sleeves:
    - trend_following
    - reversal
    - compression_breakout
  allowed_long_strategy_sleeves:
    - trend_following
    - compression_breakout           # Added: longs currently have 1 entry path; shorts have 3
  allowed_short_strategy_sleeves:
    - trend_following
    - reversal
    - compression_breakout
  max_open_trades_override: 5
  top_pairs_to_trade_override: 5
  threshold_relaxation: 22.0          # Increased from 15.0 for paper sample collection
  min_score_floor: 22.0              # Lowered from 28.0 + chaos penalty reform
  ev_hard_gate_min_trades: 40     # After this, EV relax is disabled; only positive EV passes
  ml_hard_gate_min_trades: 999
  ev_relax_score_buffer: 3.0
  ev_bootstrap_max_deficit_pct: 1.25      # Paper bootstrap can tolerate up to -1.25% EV
  ev_probation_max_deficit_pct: 0.75      # Probation is stricter than bootstrap, still paper-only
  high_conviction_score_trigger: 64.0
  high_conviction_ev_max_deficit_pct: 0.50
  high_conviction_min_total_scale: 0.30
  stress_tighten_daily_loss_pct: -3.0       # On bad paper days, stop EV-relaxing negative expectancy
  stress_tighten_consecutive_losses: 3      # Loss-streak fallback for the same tightening
  stress_min_ev_net_pct: 0.0                # During stress, relaxed samples must be non-negative EV
  loss_streak_guard_enabled: true           # Paper-only: no halt/cooldown, but wait for cleaner setups when losing
  loss_streak_guard_daily_loss_pct: -2.0
  loss_streak_guard_consecutive_losses: 4   # Relaxed from 2 for paper sample collection
  loss_streak_guard_streak_daily_pnl_pct: 0.0 # Streak-only guard needs non-positive day or drawdown below
  loss_streak_guard_streak_drawdown_pct: 2.0 # Prevent stale streaks from choking green/equity-healthy days
  loss_streak_guard_min_score_buffer: 4.0   # Relaxed from 8.0 for paper sample collection
  loss_streak_guard_min_setup_quality: 68.0
  loss_streak_guard_require_ev: true
  loss_streak_guard_min_p_win: 0.42
  loss_streak_guard_min_ev_net_pct: 0.0
  loss_streak_guard_max_total_scale: 0.50   # Relaxed from 0.35 for paper sample collection
  experimental_setup_stress_block_enabled: true # Pause unproven setup cohorts on bad paper days
  experimental_setup_stress_block_daily_loss_pct: -3.0
  experimental_setup_stress_block_consecutive_losses: 3
  experimental_setup_stress_block_setup_types:
    - mtf_price_action_continuation
    - vwap_pullback_continuation
    - liquidity_sweep_reversal
  ev_observation_floor_enabled: true        # Even with EV gate off, block very low-probability deep-negative EV samples
  ev_observation_min_p_win: 0.30            # Floor from IN/USDT postmortem: avoid spending risk on <30% p_win ideas
  ev_observation_max_deficit_pct: 0.75      # Block only when net EV deficit is materially worse than -0.75%
  market_context_guard_enabled: true        # Paper-only: block market contexts with clearly negative realised math
  blocked_market_rotation_states:
    - alts_outperforming
  blocked_market_context_states: []
  cohort_exploration_enabled: true          # Paper-only: tiny samples when cohort policy blocks otherwise clean trend setups
  cohort_exploration_max_open: 1
  cohort_exploration_max_total_scale: 0.25
  cohort_exploration_min_score_buffer: 8.0
  cohort_exploration_min_setup_quality: 64.0
  cohort_exploration_min_p_win: 0.55
  cohort_exploration_min_ev_net_pct: -0.25
  cohort_exploration_stop_daily_loss_pct: -1.0
  cohort_exploration_stop_consecutive_losses: 2
  cohort_exploration_allowed_directions:
    - long
  cohort_exploration_allowed_regimes:
    - trending_expansion
  cohort_exploration_allowed_sleeves:
    - trend_following
  cohort_exploration_allowed_setup_types:
    - trend_continuation
  positive_ev_probe_enabled: true          # Paper-only: sample strong positive-EV liquidity-sweep shorts below score floor
  positive_ev_probe_min_ev_net_pct: 0.50    # Net EV must be meaningfully positive after costs
  positive_ev_probe_min_p_win: 0.50         # Positive-EV sweep probes may start at break-even probability
  positive_ev_probe_min_score: 30.0         # Never take zero-score/regime-mismatch probes
  positive_ev_probe_max_score_deficit: 12.0 # Score may be below threshold only within this bounded gap
  positive_ev_probe_min_sm_score: 75.0      # Require strong smart-money evidence
  positive_ev_probe_allowed_directions:
    - short
  positive_ev_probe_allowed_regimes:
    - trending_expansion
    - distribution
  positive_ev_probe_allowed_sm_phases:
    - liquidity_sweep
  positive_ev_probe_allowed_sleeves:
    - neutral
    - reversal
  high_conviction_allowed_regimes:
    - trending_expansion
    - accumulation_compression
  high_conviction_allowed_sm_phases:
    - liquidity_sweep
    - trending
    - accumulation
  high_conviction_short_allowed_regimes:
    - distribution
  high_conviction_short_allowed_sm_phases:
    - distribution
    - liquidity_sweep

ml:
  hard_gate_min_trades: 60
  regime_hard_lock_min_trades: 30
  max_daily_vetoes: 2
  max_veto_rate: 0.20
  veto_budget_min_candidates: 12

risk:
  # ── AGGRESSIVE-EDGE TUNING ──────────────────────────────────────────────
  # Per-trade risk is up but still well below the 2-3% range typical for
  # systematic perp strategies; the daily/weekly/dd caps below act as a
  # hard floor so bursts of losses get arrested fast.
  risk_per_trade_pct: 1.5            # UPGRADED from 1.25 — more aggressive on validated edge
  max_risk_per_trade_pct: 2.5        # UPGRADED from 1.75 — Kelly can express up to 2.5%
  daily_loss_cap_pct: 5.0          # Paper sample collection cap; cooldown/streak halt disabled below
  weekly_loss_cap_pct: 10.0        # 10% weekly loss cap enforced
  max_drawdown_pct: 20.0           # TIGHTENED from 25% — earlier brake protects equity curve
  min_rr_ratio: 1.8                # LOWERED from 2.0 — allows high WR setups with 1.8R min
  max_leverage: 12                 # UPGRADED: allow up to 12x on high-conviction
  default_leverage: 6              # UPGRADED from 5x
  stop_loss_atr_multiplier: 2.0    # WIDENED from 1.3 — audit shows 6/7 SL trades were profitable before stop; tighter SL was noise, not edge
  max_stop_distance_pct: 50.0       # Reject abnormal ATR stops/negative short TPs on microcaps
  min_notional_usd: 5.0            # Binance Futures minimum order notional
  min_risk_usd: 0.50               # Paper-account floor; lets Brain/FundManager scale-down matter on $70 equity
  cooldown_after_loss_streak: 5    # Pause after 5 consecutive losses
  cooldown_minutes: 60             # 60-minute cooldown after loss streak
  max_symbol_risk_pct: 2.5         # Match max_risk_per_trade so single-symbol bets are not artificially capped
  max_sector_risk_pct: 2.5         # Sector limit: avoid correlated clusters (e.g. 3 AI coins at once)
  max_direction_risk_pct: 5.50     # Allow heavier directional concentration when conviction is high
  # ── Correlation cap ────────────────────────────────────────────────────
  # Block opening a new trade that is highly correlated (and direction-
  # compounding) with an existing open trade.  Prevents three "different"
  # alt longs from collapsing into one beta-1 bet.
  correlation_filter:
    enabled: true
    lookback_bars: 48              # ~2 days on the 1H primary
    corr_max: 0.85                 # block at >= 0.85 abs corr
    min_overlap_bars: 24           # require at least this much shared history

exit:
  tp1_r_multiple: 1.5
  tp2_r_multiple: 2.5                   # UPGRADED from 2.0 — let winners run further
  tp1_size_pct: 0.40                    # REDUCED from 0.50 — keep more for runners
  tp2_size_pct: 0.30
  trail_size_pct: 0.30                  # INCREASED from 0.20 — more in trailing runner
  breakeven_trigger_r: 0.8              # FASTER breakeven (was 1.0) — protect capital sooner
  trailing_atr_multiplier: 1.3          # TIGHTER from 1.5 — regime-adaptive handles the rest
  tp2_trailing_stop_pct: 0.15
  max_hold_duration_s: 172800

  # ── Adverse-move early cut ────────────────────────────────────────────
  # Cut a loser before it reaches full SL when the trade has clearly
  # failed (deep adverse, no favourable wiggle, modest age).  Converts
  # ~1R losers into ~0.6R losers without affecting winners.
  # Ref: arXiv:1609.00869 "Bayesian Analysis of Drawdown Distributions"
  early_cut:
    enabled: true
    min_age_s: 900                # RELAXED from 420 — audit shows trades cut <15min had 0% WR; give trades time to develop
    max_age_s: 7200               # RELAXED from 5400 — 2h window instead of 1.5h
    mae_r_threshold: 0.75         # RELAXED from 0.55 — wider SL means R is bigger; don't cut in noise zone
    mfe_r_ceiling: 0.30           # RELAXED from 0.15 — allow trades that showed some life to continue
    long_min_age_s: 1800          # Longs need more time: audit shows long winner held 8h; long losers cut at 0.5h avg

  # ── Passport contract monitor ───────────────────────────────────────
  # Entry passport is the setup contract.  Before TP1, close paper/live
  # positions that spend too much R without following their expected path.
  passport_monitor:
    enabled: true
    min_age_s: 900                  # RELAXED from 600 — align with early_cut min_age
    trend_failure_mae_r: 0.80       # RELAXED from 0.70 — wider SL = bigger R; don't cut in noise
    trend_mfe_ceiling_r: 0.30       # RELAXED from 0.20 — allow trades that showed momentum
    experimental_continuation_failure_mae_r: 0.65 # RELAXED from 0.50 — wider SL gives more room
    experimental_continuation_mfe_ceiling_r: 0.40 # RELAXED from 0.35
    breakout_failure_mae_r: 0.60                  # RELAXED from 0.45 — wider SL gives more room
    breakout_mfe_ceiling_r: 0.30                  # RELAXED from 0.25
    reversal_failure_mae_r: 0.65                  # RELAXED from 0.50
    reversal_mfe_ceiling_r: 0.30                  # RELAXED from 0.20

exit_profiles:
  trend_following:
    tp1_r_multiple: 2.0                  # UPGRADED from 1.8 — trend trades should aim higher
    tp2_r_multiple: 3.5                  # UPGRADED from 2.8
    tp3_r_multiple: 5.0                  # UPGRADED from 4.0 — let trend runners ride
    tp1_size_pct: 0.30                   # REDUCED from 0.35 — hold more for trend continuation
    tp2_size_pct: 0.30                   # REDUCED from 0.35
    trail_size_pct: 0.40                 # INCREASED from 0.30 — big trailing allocation
    breakeven_trigger_r: 0.8             # FASTER from 1.0
    trailing_atr_multiplier: 1.6         # TIGHTER from 1.8, regime-adaptive handles the rest
    max_hold_duration_s: 345600          # 4 days — longs need time to develop (audit: winner held 8h)
    max_hold_duration_s_short: 28800     # 8h for shorts — audit: shorts held 8-24h are 0% WR, 3-8h is the sweet spot
  compression_breakout:
    tp1_r_multiple: 1.5                  # UPGRADED from 1.4
    tp2_r_multiple: 2.8                  # UPGRADED from 2.3
    tp3_r_multiple: 4.0                  # UPGRADED from 3.2
    tp1_size_pct: 0.35                   # REDUCED from 0.40
    tp2_size_pct: 0.30                   # REDUCED from 0.35
    trail_size_pct: 0.35                 # INCREASED from 0.25
    breakeven_trigger_r: 0.8             # FASTER from 0.9
    trailing_atr_multiplier: 1.2         # TIGHTER from 1.4
    max_hold_duration_s: 172800
  reversal:
    tp1_r_multiple: 1.2                  # UPGRADED from 1.0 — don't exit too early
    tp2_r_multiple: 2.0                  # UPGRADED from 1.6
    tp3_r_multiple: 3.0                  # UPGRADED from 2.2
    tp1_size_pct: 0.40                   # REDUCED from 0.50
    tp2_size_pct: 0.30
    trail_size_pct: 0.30                 # INCREASED from 0.20
    breakeven_trigger_r: 0.7             # FASTER from 0.8
    trailing_atr_multiplier: 1.0         # TIGHTER from 1.1
    max_hold_duration_s: 86400

filters:
  min_24h_volume_usdt: 50_000_000   # Expanded universe; keep liquidity floor, no trading-logic change
  min_price_usdt: 0.001
  max_entry_spread_pct: 0.15        # Skip entry if bid-ask spread > 0.15% (audit: slippage = 48% of gross loss)
  blocked_sessions:                  # Hard block: audit shows 8 trades / -$16.81 / 12.5% WR
    - asia
  blacklisted_pairs:
    - USDCUSDT
    - BUSDUSDT
    - TUSDUSDT
    - USDTUSDT
  stablecoins:
    - USDC
    - BUSD
    - TUSD
    - DAI
    - FDUSD

timeframes:
  primary: 1h
  higher: 4h
  lower: 15m
  entry: 5m

indicators:
  atr_period: 14
  adx_period: 14                        # ADX trend strength period
  ema_fast: 21
  ema_slow: 55
  ema_trend: 200
  rsi_period: 14
  volume_spike_multiplier: 2.0
  volume_lookback: 20
  oi_change_threshold_pct: 1.0
  funding_high_threshold: 0.03
  funding_low_threshold: -0.01
  btc_correlation_lookback: 48
  min_btc_correlation: 0.5

structure:
  swing_lookback: 10
  bos_confirmation_candles: 2
  liquidity_sweep_pct: 0.3

order_book:
  depth_levels: 10
  imbalance_threshold: 1.5
  wall_size_multiplier: 5.0
  absorption_volume_mult: 3.0

market_context:
  enabled: true
  ttl_seconds: 300
  lookback_bars: 48
  trend_threshold_pct: 1.0
  btc_symbol: "BTC/USDT:USDT"
  eth_symbol: "ETH/USDT:USDT"
  btc_d_symbol: ""      # Optional external/index symbol when supported
  total_symbol: ""      # Optional external/index symbol when supported

time_series:
  enabled: true
  lookback_bars: 96        # Causal return window for stationarity/volatility diagnostics
  min_returns: 30
  ewma_lambda: 0.94        # RiskMetrics-style EWMA volatility; lighter than runtime GARCH
  shock_z_threshold: 2.8
  vol_ratio_threshold: 1.65
  markov_window: 20        # Rolling return state window for bull/bear/sideways transitions
  markov_threshold_pct: 2.0

scoring:
  weights:
    trend_strength: 20
    volume_confirmation: 15
    structure_quality: 20
    open_interest: 15
    funding_sentiment: 10
    order_book: 10
    volatility: 10
  dynamic_adjustment: true
  adjustment_rate: 0.02

strategy:
  trend_min_score: 58              # LOWERED from 60 — let quality setups through
  trend_min_structure: 52          # LOWERED from 55
  trend_long_only: false             # UPGRADED: both directions active per momentum research
  trend_require_participation: true  # With EV gate off, trend needs volume + OI confirmation
  trend_min_alignment: 0.54          # Directional microstructure passport floor
  breakout_min_alignment: 0.57       # Compression breakouts need cleaner flow than trends
  reversal_min_alignment: 0.45       # Sweeps can be contrarian, but cannot contradict structure
  mtf_price_action_continuation:
    enabled: true                    # Restored: HTF trend + pullback hold + primary continuation break
    min_quality_score: 72.0
    require_participation: true      # Experimental cohort: require volume + OI confirmation
    block_high_dispersion: true      # Avoid continuation entries when cross-sectional momentum is chaotic
    breakout_lookback: 20
    pullback_lookback: 8
  vwap_pullback_continuation:
    enabled: true                    # Pro-style intraday trend pullback: VWAP reclaim/resume with volume
    min_quality_score: 74.0
    require_participation: true      # Needs futures participation, not price-only VWAP touch
    block_high_dispersion: true
    vwap_period: 20
    pullback_lookback: 6
    min_volume_ratio: 1.15
    max_atr_distance: 0.85
  liquidity_sweep_reversal:
    enabled: true                    # SMC/ICT-style liquidity raid + reclaim close, isolated from generic reversal
    min_quality_score: 78.0
    require_participation: true
    block_high_dispersion: true
    lookback_bars: 24
    confirm_bars: 2
    pierce_min_pct: 0.0015
    reclaim_buffer_atr: 0.10
    min_volume_ratio: 1.20
    max_volatility: 80
  enable_compression_breakout: true
  compression_min_structure: 55       # LOWERED from 58
  reversal_max_volatility: 80         # INCREASED from 75 — reversals can happen in vol
  allow_long_reversal: true
  allow_short_reversal: true
  short_reversal_require_distribution: true
  short_reversal_min_sm_score: 78
  short_reversal_min_structure: 58
  short_reversal_min_volume: 35
  # ── Phase D / Liq Sweep dedicated short setups ─────────────────────────
  # Ported from quantedge where these are the primary statistical
  # edge cohorts (`IMMINENT_DUMP + PHASE_D` and `IMMINENT_DUMP + LIQ_SWEEP`).
  # Admits shorts via price-structure thesis without requiring
  # regime=='distribution', but still respects volatility / volume floors.
  enable_short_setups: false       # Paused: phase_d paper audit showed negative edge; keep as observer only
  short_setup_min_confidence: 0.65   # detector confidence threshold (0–1)
  short_setup_min_structure: 50      # below this, breakdown is too noisy
  short_setup_max_volatility: 85     # block extreme-volatility chase prints
  phase_d:
    support_lookback: 30             # bars used for the 25th-pctile support level
    distribution_range_lookback: 40  # bars used to confirm prior distribution range
    distribution_range_max_pct: 0.12 # range pct ceiling that still counts as ranging
    vol_spike_min_ratio: 1.5         # volume_ratio required for vol_spike confirmation
    sl_atr_multiplier: 1.0           # SL = recent_high + ATR * mult
  liq_sweep:
    lookback_bars: 20                # window to find equal-high pool
    eq_tolerance_pct: 0.003          # equal-highs tolerance (0.3 %)
    pierce_min_pct: 0.002            # wick must pierce above pool by 0.2 %
    vol_spike_min_ratio: 1.3         # volume_ratio required for vol_spike confirmation
    sl_atr_multiplier: 0.5           # SL = sweep_high + ATR * mult (tight)
  dispersion_warn: 28
  dispersion_high: 38

learning:
  min_trades_to_adjust: 20
  lookback_trades: 100
  save_path: "models/learning_state_futures.json"
  trade_log_path: "data/trades/trade_log_futures.parquet"

backtest:
  start_date: "2025-04-19"
  end_date: "2026-04-19"
  initial_capital: 10000
  commission_pct: 0.04
  slippage_pct: 0.10
  score_threshold: 65          # Match live threshold — only take high-conviction signals

logging:
  level: INFO
  log_file: "logs/futures_trader.log"
  trade_log_file: "logs/futures_trades.log"
  max_bytes: 10_485_760
  backup_count: 5

# ── Telegram Alerts ─────────────────────────────────────────────────────────
telegram:
  token: ""         # Set via .env: TELEGRAM_TOKEN
  chat_id: ""       # Set via .env: TELEGRAM_CHAT_ID
  parse_mode: ""    # Plain text by default; set Markdown only after escaping dynamic labels
  heartbeat_interval_minutes: 1   # Short account-summary heartbeat every minute
  cycle_report_interval_minutes: 5 # Detailed Jim Simons fund-manager report every 5 minutes
  equity_graph_interval_minutes: 60 # Separate PNG balance/equity graph cadence
  bootstrap_audit_interval_hours: 12 # Separate bootstrap audit report cadence (0 = off)
  crypto_news_interval_minutes: 0  # Temporarily disabled to reduce server/network/LLM load (0 = off)
  crypto_news_limit: 5             # Number of narratives in the brief
  crypto_news_timeout_seconds: 8.0 # Total timeout per RSS source fetch
  crypto_news_llm_enabled: true    # Uses a public LLM API when a provider key is present; otherwise falls back to rules
  crypto_news_llm_provider: "auto" # auto|gemini|openrouter|groq|huggingface|openai|custom
  crypto_news_llm_timeout_seconds: 12.0
  crypto_news_llm_api_key_env: ""  # custom provider only; prefer env vars, never commit keys
  crypto_news_llm_api_url: ""      # custom provider only; OpenAI-compatible /chat/completions URL
  crypto_news_llm_model: ""        # custom provider only
  crypto_news_llm_providers:
    gemini:
      api_url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
      model: "gemini-2.5-flash"
      api_key_env:
        - "GEMINI_API_KEY"
        - "GOOGLE_API_KEY"
    openrouter:
      api_url: "https://openrouter.ai/api/v1/chat/completions"
      model: "openrouter/free"
      api_key_env:
        - "OPENROUTER_API_KEY"
    groq:
      api_url: "https://api.groq.com/openai/v1/chat/completions"
      model: "llama-3.3-70b-versatile"
      api_key_env:
        - "GROQ_API_KEY"
    huggingface:
      api_url: "https://router.huggingface.co/v1/chat/completions"
      model: "openai/gpt-oss-120b"
      api_key_env:
        - "HF_TOKEN"
        - "HUGGINGFACEHUB_API_TOKEN"
    openai:
      api_url: "https://api.openai.com/v1/chat/completions"
      model: "gpt-4.1-mini"
      api_key_env:
        - "OPENAI_API_KEY"
  crypto_news_feeds:
    - "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - "https://cointelegraph.com/rss"
    - "https://decrypt.co/feed"
  pnl_update_interval_minutes: 1  # Floating P&L update interval (0 = off)

safety:
  pause_on_extreme_volatility: true
  extreme_vol_atr_multiplier: 3.0
  max_consecutive_losses: 5              # Hard halt after 5 consecutive losses
  api_retry_attempts: 3
  api_retry_delay_seconds: 5
  # Hang-storm protection (added 2026-05-22). Two-layer timeout on every
  # Binance API call. Inner enforces aiohttp ClientTimeout; outer enforces
  # asyncio.wait_for. Outer must be >= inner so ccxt surfaces its own
  # TimeoutError before asyncio cancels the coroutine.
  api_http_timeout_seconds: 20.0         # ccxt -> aiohttp ClientTimeout(total)
  api_call_timeout_seconds: 30.0         # asyncio.wait_for ceiling per call
  market_data_snapshot_concurrency: 8    # Bound symbol-level data fanout; prevents OHLCV hang-storms
  market_data_snapshot_timeout_seconds: 25.0 # Drop slow symbols and keep the scan cycle moving
  heartbeat_interval_seconds: 30
  auto_live_on_readiness: false          # Manual promotion only after audited forward results
  min_live_balance_usd: 10.0             # Abort live transition if balance below this
  performance_report_interval_minutes: 5  # Backstop cadence if cycle report interval is unset
  close_positions_on_shutdown: false     # Preserve positions on service restart/shutdown; use manual panic close for emergencies
  heartbeat_fail_kill_switch_count: 6    # Repeated balance/API failure -> freeze new entries
  runtime_error_kill_switch_count: 5     # Repeated main-loop exceptions -> freeze new entries
  equity_mismatch_tolerance_pct: 20.0    # Large mismatch between bot equity and exchange equity triggers kill-switch
  # ── Session-aware sizing ──────────────────────────────────────────────
  # Crypto futures vol/edge profile differs across the three TradFi sessions.
  # We scale the FundManager output multiplicatively by session.  Defaults
  # are derived from rolling Sharpe-by-session studies on 2024–2025 BTC/ETH
  # perpetuals.  Overrides take effect immediately.
  session_aware_sizing: true
  session_size_multipliers:
    asia: 0.85
    london: 1.10
    ny: 1.10
    overlap_london_ny: 1.20

# ── Cohort Edge Policy ───────────────────────────────────────────────────────
# Blocks setup families that already show negative expectancy in closed trades.
edge_policy:
  enabled: true
  lookback_trades: 80
  max_recent_pair_losses: 3
  pair_history_window: 6
  max_recent_sector_losses: 2      # Tighter sector lock: 2 losses in a sector stops new entries
  sector_history_window: 5
  long_only: false
  allowed_regimes:
    - trending_expansion
    - distribution
    - accumulation_compression
  allowed_sm_phases:
    - neutral
    - trending
    - accumulation
    - liquidity_sweep
    - distribution
  allowed_strategy_sleeves:
    - trend_following
    - reversal
    - compression_breakout
  attribution:
    min_trades: 6
    block_below_pf: 0.85
    block_below_wr: 0.35
    relief_above_pf: 1.30
    relief_above_wr: 0.55
    max_threshold_relief: 5.0
    max_ranking_bonus: 4.0

# ── Strategy Lifecycle / Cohort Health ───────────────────────────────────────
# Each cohort graduates: RESEARCH -> PAPER_VALIDATION -> SMALL_LIVE -> ACTIVE.
# Negative cohorts are degraded/disabled automatically for live admission.
lifecycle:
  enabled: true
  default_paper_only: true
  research_min_trades: 5
  paper_validation_min_trades: 12
  small_live_min_trades: 25
  active_min_trades: 40
  min_profit_factor: 1.10
  min_expectancy_usd: 0.00
  min_win_rate: 0.45
  max_outlier_share: 0.60
  max_stop_hit_rate: 0.55
  disable_profit_factor_below: 0.95
  disable_expectancy_usd_below: -0.25
  disable_max_drawdown_usd: 25.0
  cohort_key_fields:
    - strategy_name
    - market_regime
    - session
    - volatility_bucket
    - trend_bucket
    - signal_type
    - asset
    - timeframe
    - direction

# ── Smart Money Detection ────────────────────────────────────────────────────
smart_money:
  oi_accumulation_threshold_pct: 0.2    # OI rise % per snapshot to flag accumulation
  oi_distribution_threshold_pct: -0.1   # OI fall % per snapshot to flag distribution
  oi_baseline_seconds: 3600             # OI comparison window (1h gives real accumulation signal)
  price_stagnation_pct: 0.5             # Max price change % to be "flat"
  funding_extreme_threshold: 0.05       # |funding| above this = extreme
  volume_buildup_periods: 5             # Candles to check for gradual vol increase
  min_smart_money_score: 60             # Minimum SM score to allow trade
  ls_long_extreme: 0.70                 # L/S ratio: > 0.70 = crowded longs (contrarian bearish)
  ls_short_extreme: 0.30                # L/S ratio: < 0.30 = crowded shorts (contrarian bullish)

# ── Edge Detector (pre-EV intelligence layer) ───────────────────────────────
# mode: observer (log-only) → soft_gate (size_mult applied) → active_gate (BLOCK suppresses)
# Phase 2 default: soft_gate.  Edge memory hydrates from existing trade log;
# size_mult only departs from 1.0 once per-pair/edge sample size builds up.
edge_detector:
  mode: soft_gate
  min_sample_for_gate: 40               # n below this: pseudo-edge downgraded to REDUCE_SIZE (never BLOCK)
  global_baseline_winrate: 0.50         # fallback baseline when pair/regime samples < 5

# ── Loss Contributor Guard ──────────────────────────────────────────────────
# Soft penalties from realised paper attribution: avoid spending normal risk on
# contexts currently causing the largest losses while keeping learning alive.
loss_contributor_guard:
  enabled: true
  mixed_rotation_score_mult: 0.97           # Relaxed from 0.94 for paper sample collection
  mixed_rotation_size_mult: 0.85            # Relaxed from 0.80
  mixed_rotation_threshold_shift: 3.0       # Relaxed from 5.0
  missing_sector_rotation_score_mult: 0.98  # Relaxed from 0.96
  missing_sector_rotation_size_mult: 0.80
  missing_sector_rotation_threshold_shift: 3.0
  probation_score_mult: 0.92
  probation_size_mult: 0.65
  probation_threshold_shift: 6.0
  short_nonpositive_ev_score_mult: 0.90
  short_nonpositive_ev_size_mult: 0.70
  short_nonpositive_ev_threshold_shift: 4.0
  short_unsupported_rotation_score_mult: 0.94
  short_unsupported_rotation_size_mult: 0.75
  short_unsupported_rotation_threshold_shift: 4.0
  # Alts outperforming while BTC drops = -$16.78 / 0% WR (3 trades)
  alts_btc_down_score_mult: 0.85
  alts_btc_down_size_mult: 0.50
  alts_btc_down_threshold_shift: 10.0
  probation_sectors:
    - depin
    - commodity
    - l1
  probation_symbols:
    - GRASS
    - XAU
    - HANA
    - GUA
    - INJ
  # Session penalties: Asia session is -$16.81 / 12.5% WR across 8 trades
  session_penalties:
    asia:
      score_mult: 0.88
      size_mult: 0.60
      threshold_shift: 8.0
    overlap_london_ny:
      score_mult: 0.96
      size_mult: 0.85
      threshold_shift: 3.0

# ── Short Macro Overlay ──────────────────────────────────────────────────────
# Soft ranking/sizing overlay for shorts. It rewards shorts only when broad
# crypto tape confirms: BTC down, BTC.D down, TOTAL weak, and sector rotation
# rotating out/weakening. It penalizes shorts in risk-on or sector-strong tape.
short_macro_overlay:
  enabled: true
  strong_score_mult: 1.06
  strong_size_mult: 1.08
  strong_threshold_shift: -2.0
  supportive_score_mult: 1.03
  supportive_size_mult: 1.03
  supportive_threshold_shift: -1.0
  hostile_score_mult: 0.95                  # Relaxed from 0.92 for paper sample collection
  hostile_size_mult: 0.80                   # Relaxed from 0.75
  hostile_threshold_shift: 3.0              # Relaxed from 4.0
  require_sector_confirmation_for_boost: true
  min_sector_confidence: 0.35
  boost_setup_types:
    - trend_continuation
    - liquidity_sweep_reversal
    - compression_breakout

# ── Probabilistic EV Model ───────────────────────────────────────────────────
ev_model:
  gate_enabled: false                     # Observe EV only; scans are broadly negative so do not hard-block admission yet
  statistical_gate_enabled: true          # Require conservative EV lower-bound to stay positive before admission
  confidence_z: 1.0                       # One-sided lower bound; roughly 84% conservative p(win) estimate
  payoff_haircut: 0.85                    # Haircut realised avg win before gate math
  loss_inflation: 1.10                    # Inflate realised avg loss before gate math
  cost_buffer_pct: 0.05                   # Extra execution/model-error buffer in EV percent
  min_conservative_ev_pct: 0.0            # Conservative EV must be non-negative after all buffers
  taker_fee_pct: 0.04                   # Binance futures taker fee %
  maker_fee_pct: 0.02                   # Binance futures maker fee %
  slippage_pct: 0.10                    # Expected slippage per leg % (Binance futures realistic)
  min_ev_pct: 0.03                      # Point-estimate EV still must clear 3bp net edge
  min_p_win: 0.40                       # Allow asymmetric payoff setups only after conservative EV confirms
  min_confidence: 0.50                  # LOWERED from 0.55 — faster data collection
  min_trades_for_ev: 20                 # Minimum matched setup samples before conservative EV can hard-pass
  prior_win_rate: 0.52                  # LOWERED from 0.55 — less optimistic prior
  prior_avg_win_pct: 2.8                # UPGRADED from 2.5 — targeting higher TP multiples
  prior_avg_loss_pct: 1.0               # Prior avg loss % of equity
  max_kelly_pct: 5.0                    # UPGRADED from 3.0 — high-conviction expression

# ── Fractional Kelly Position Sizing ────────────────────────────────────────
kelly:
  fraction: 0.30                        # UPGRADED: 30% Kelly (was 25%) — more aggressive on proven edge
  max_kelly_pct: 5.0                    # UPGRADED: hard cap 5% (was 4%) for high-conviction
  min_kelly_pct: 0.7                    # UPGRADED: floor 0.7% (was 0.6)
  volatility_scale: true                # Reduce size in high-vol regimes
  vol_target_atr_pct: 1.5              # Target ATR% for vol-neutral sizing
  confidence_scaling: true              # NEW: scale up size on high-confidence high-EV setups

# ── Derivatives Data Fetching ────────────────────────────────────────────────
derivatives:
  ls_ratio_period: "5m"                 # Binance L/S ratio candle period
  ls_ratio_limit: 1                     # Fetch only latest
  taker_volume_period: "5m"
  taker_volume_limit: 1

# ── Regime Classifier ────────────────────────────────────────────────────────
regime:
  adx_trending_threshold: 25            # ADX above this = trending
  atr_extreme_vol_multiplier: 2.5       # ATR spike = high vol regime
  sideways_atr_pct_max: 0.5            # ATR % below this = sideways

# ── Execution Engine ─────────────────────────────────────────────────────────
execution:
  prefer_limit_orders: true             # Use limit entry orders
  limit_order_offset_pct: 0.05          # Offset from mid-price for limit (%)
  limit_order_timeout_s: 60             # Cancel unfilled limit after N seconds
  min_spread_pct: 0.02                  # Skip pair if spread exceeds this %
  entry_scale_levels: 2                 # Scale into position across 2 levels
  entry_scale_pct:                      # Weight at each scaling level
    - 0.60
    - 0.40

# Note: adx_period is defined under the `indicators` section above (line ~64).

# ── Shadow Mode ──────────────────────────────────────────────────────────────
shadow:
  enabled: true                    # Runs ghost trades to accelerate ML training data
  report_interval_trades: 10       # Print shadow report every N closed trades

# -- Trading Brain Journal -----------------------------------------------------
# Local read-only diagnostics from closed trades. No scoring, risk, or execution impact.
trading_brain:
  enabled: true
  output_dir: "data/trading_brain"
  closed_trade_notes_enabled: true
  edge_report_enabled: true
  min_trades: 2
  top_n: 5
