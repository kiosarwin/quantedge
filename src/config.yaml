# ============================================================
#  NINJA TRADER — Futures Edition (config.yaml)
#  Binance USDT-margined Perpetual Futures
# ============================================================

exchange:
  name: binance_futures
  testnet: true                     # Set false only when going live
  api_key: ""                      # Set via .env: BINANCE_API_KEY
  api_secret: ""                   # Set via .env: BINANCE_API_SECRET
  recv_window: 10000
  # fapi_base_url: "https://fapi1.binance.com"   # Uncomment if fapi.binance.com is blocked

trading:
  mode: paper                      # paper | live | backtest
  base_currency: USDT
  paper_starting_equity: 500       # $500 — mirrors live starting capital
  min_score_threshold: 60          # Only trade if score >= 60 (see regime_thresholds for per-regime overrides)
  max_open_trades: 3               # Max 3 simultaneous trades with $500
  top_pairs_to_trade: 3
  scan_interval_seconds: 60
  candle_refresh_seconds: 30
  signal_confirmation_scans: 2   # require N consecutive scans above threshold
  signal_max_age_seconds: 300    # expire signal if not confirmed within 5 min
  regime_thresholds:             # override min_score_threshold per regime
    trending_expansion: 55       # cleaner signals, be more permissive
    accumulation_compression: 65 # harder to read, be more strict

risk:
  risk_per_trade_pct: 1.5          # 1.5% of $500 = $7.50 risk per trade
  max_risk_per_trade_pct: 2.0      # Hard cap: $10.00 per trade
  daily_loss_cap_pct: 5.0          # Stop trading if down $25 in a day
  max_drawdown_pct: 15.0           # Wider tolerance for small account volatility
  min_rr_ratio: 2.0                # Only take trades with R:R >= 2
  max_leverage: 10                 # Allow up to 10x (needed for $100 meaningful positions)
  default_leverage: 5              # 5x default — $1.50 risk controls ~$37 notional
  stop_loss_atr_multiplier: 1.5
  min_notional_usd: 5.0            # Binance Futures minimum order notional = $5

exit:
  tp1_r_multiple: 1.5
  tp2_r_multiple: 2.0
  tp1_size_pct: 0.50
  tp2_size_pct: 0.30
  trail_size_pct: 0.20
  breakeven_trigger_r: 1.0
  trailing_atr_multiplier: 1.5
  tp2_trailing_stop_pct: 0.15
  max_hold_duration_s: 172800

filters:
  min_24h_volume_usdt: 100_000_000
  min_price_usdt: 0.001
  blacklisted_pairs:
    - USDCUSDT
    - BUSDUSDT
    - TUSDUSDT
    - USDTUSDT
  stablecoins:
    - USDC
    - BUSD
    - TUSD
    - DAI
    - FDUSD

timeframes:
  primary: 1h
  higher: 4h
  lower: 15m
  entry: 5m

indicators:
  atr_period: 14
  adx_period: 14                        # ADX trend strength period
  ema_fast: 21
  ema_slow: 55
  ema_trend: 200
  rsi_period: 14
  volume_spike_multiplier: 2.0
  volume_lookback: 20
  oi_change_threshold_pct: 1.0
  funding_high_threshold: 0.03
  funding_low_threshold: -0.01
  btc_correlation_lookback: 48
  min_btc_correlation: 0.5

structure:
  swing_lookback: 10
  bos_confirmation_candles: 2
  liquidity_sweep_pct: 0.3

order_book:
  depth_levels: 20
  imbalance_threshold: 1.5
  wall_size_multiplier: 5.0
  absorption_volume_mult: 3.0

scoring:
  weights:
    trend_strength: 20
    volume_confirmation: 15
    structure_quality: 20
    open_interest: 15
    funding_sentiment: 10
    order_book: 10
    volatility: 10
  dynamic_adjustment: true
  adjustment_rate: 0.02

learning:
  min_trades_to_adjust: 20
  lookback_trades: 100
  save_path: "models/learning_state_futures.json"
  trade_log_path: "data/trades/trade_log_futures.parquet"

backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 10000
  commission_pct: 0.04
  slippage_pct: 0.10

logging:
  level: INFO
  log_file: "logs/futures_trader.log"
  trade_log_file: "logs/futures_trades.log"
  max_bytes: 10_485_760
  backup_count: 5

# ── Telegram Alerts ─────────────────────────────────────────────────────────
telegram:
  token: ""         # Set via .env: TELEGRAM_TOKEN
  chat_id: ""       # Set via .env: TELEGRAM_CHAT_ID
  heartbeat_interval_minutes: 0    # Off; fund manager report is the primary Telegram cadence
  cycle_report_interval_minutes: 0 # Detailed fund-manager Telegram report cadence (0 = off)
  equity_graph_interval_minutes: 60 # Separate PNG balance/equity graph cadence

safety:
  pause_on_extreme_volatility: true
  extreme_vol_atr_multiplier: 3.0
  max_consecutive_losses: 3              # Stop after 3 consecutive losses
  api_retry_attempts: 3
  api_retry_delay_seconds: 5
  heartbeat_interval_seconds: 30
  auto_live_on_readiness: true           # Auto-switch to live when all 7 criteria pass
  performance_report_interval_minutes: 5  # Send fund manager report every N minutes

# ── Smart Money Detection ────────────────────────────────────────────────────
smart_money:
  oi_accumulation_threshold_pct: 0.2    # OI rise % per snapshot to flag accumulation
  oi_distribution_threshold_pct: -0.1   # OI fall % per snapshot to flag distribution
  oi_baseline_seconds: 3600             # OI comparison window (1h gives real accumulation signal)
  price_stagnation_pct: 0.5             # Max price change % to be "flat"
  funding_extreme_threshold: 0.05       # |funding| above this = extreme
  volume_buildup_periods: 5             # Candles to check for gradual vol increase
  min_smart_money_score: 60             # Minimum SM score to allow trade
  ls_long_extreme: 0.70                 # L/S ratio: > 0.70 = crowded longs (contrarian bearish)
  ls_short_extreme: 0.30                # L/S ratio: < 0.30 = crowded shorts (contrarian bullish)

# ── Probabilistic EV Model ───────────────────────────────────────────────────
ev_model:
  taker_fee_pct: 0.04                   # Binance futures taker fee %
  maker_fee_pct: 0.02                   # Binance futures maker fee %
  slippage_pct: 0.10                    # Expected slippage per leg % (Binance futures realistic)
  min_ev_pct: 0.05                      # Min net EV% to trade (after fees)
  min_confidence: 0.55                  # Min empirical confidence to gate trade
  min_trades_for_ev: 20                 # Min closed trades for reliable EV
  prior_win_rate: 0.52                  # Conservative Bayesian prior (sparse data)
  prior_avg_win_pct: 2.5                # Prior avg win % of equity (realistic 2R target)
  prior_avg_loss_pct: 1.0               # Prior avg loss % of equity
  max_kelly_pct: 3.0                    # Kelly sizing hard cap (% of equity)

# ── Fractional Kelly Position Sizing ────────────────────────────────────────
kelly:
  fraction: 0.25                        # Quarter-Kelly (conservative)
  max_kelly_pct: 3.0                    # Hard cap: max 3% equity risk
  min_kelly_pct: 0.5                    # Floor: always risk at least 0.5%
  volatility_scale: true                # Reduce size in high-vol regimes
  vol_target_atr_pct: 1.5              # Target ATR% for vol-neutral sizing

# ── Derivatives Data Fetching ────────────────────────────────────────────────
derivatives:
  ls_ratio_period: "5m"                 # Binance L/S ratio candle period
  ls_ratio_limit: 1                     # Fetch only latest
  taker_volume_period: "5m"
  taker_volume_limit: 1

# ── Regime Classifier ────────────────────────────────────────────────────────
regime:
  adx_trending_threshold: 25            # ADX above this = trending
  atr_extreme_vol_multiplier: 2.5       # ATR spike = high vol regime
  sideways_atr_pct_max: 0.5            # ATR % below this = sideways

# ── Execution Engine ─────────────────────────────────────────────────────────
execution:
  prefer_limit_orders: true             # Use limit entry orders
  limit_order_offset_pct: 0.05          # Offset from mid-price for limit (%)
  limit_order_timeout_s: 60             # Cancel unfilled limit after N seconds
  min_spread_pct: 0.02                  # Skip pair if spread exceeds this %
  entry_scale_levels: 2                 # Scale into position across 2 levels
  entry_scale_pct:                      # Weight at each scaling level
    - 0.60
    - 0.40

# Note: adx_period is defined under the `indicators` section above (line ~64).

# ── Shadow Mode ──────────────────────────────────────────────────────────────
shadow:
  enabled: true                    # Runs ghost trades to accelerate ML training data
  report_interval_trades: 10       # Print shadow report every N closed trades
